name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0) — must match pyproject.toml"
        required: true
        type: string
      environment:
        description: "Target registry"
        required: true
        default: "pypi"
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Verify version matches input
        run: |
          TOML_VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          print(d['project']['version'])
          ")
          echo "pyproject.toml version: $TOML_VERSION"
          echo "Input version:          ${{ inputs.version }}"
          if [ "$TOML_VERSION" != "${{ inputs.version }}" ]; then
            echo "ERROR: version mismatch — update pyproject.toml before publishing"
            exit 1
          fi

      - name: Build wheel and sdist
        run: python -m build

      - name: Check dist with twine
        run: twine check dist/*

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ inputs.version }}
          path: dist/
          retention-days: 7

  publish:
    name: Publish to ${{ inputs.environment }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'pypi' && 'https://pypi.org/p/overload-cli' || 'https://test.pypi.org/p/overload-cli' }}
    permissions:
      id-token: write  # required for trusted publishing (OIDC)

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ inputs.version }}
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.environment == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
          print-hash: true
