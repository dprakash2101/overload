[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overload-cli"
version = "0.3.2"
description = "Free load testing tool that reads Postman collections — browser UI + CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Devi Prakash" },
]
keywords = ["load-testing", "postman", "api-testing", "performance", "stress-test", "ci-cd", "assertions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "httpx>=0.24.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "build",
    "twine",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
overload = "overload.cli:main"

[project.urls]
Homepage = "https://dprakash2101.github.io/overload/"
Repository = "https://github.com/dprakash2101/overload"
Issues = "https://github.com/dprakash2101/overload/issues"
Documentation = "https://dprakash2101.github.io/overload/"
Changelog = "https://github.com/dprakash2101/overload/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/overload"]

[tool.hatch.build.targets.sdist]
exclude = [
    "old/",
    "tests/fixtures/",
    ".github/",
    "CLAUDE.md",
    "PLAN.md",
    ".antigravitycli/",
    ".claude/",
    ".gemini/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
